<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Rutina</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-box">
    <div class="sp-logo">PILOTOZYZ</div>
    <div class="sp-line"></div>
  </div>
</div>
<header id="top">
  <div class="hd"><h1>Rutina · <span id="dn"></span></h1><span class="mu" id="pg"></span><button id="perfilbtn" class="mbtn" aria-label="Perfil"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button><button id="menu" class="mbtn" aria-label="Menú">☰</button></div>
</header>
<nav id="tabs"></nav>
<main id="list"></main>
<section id="prog" hidden style="padding:8px 14px;max-width:640px;margin:0 auto">
  <div class="card">
    <label style="display:block;margin-bottom:10px">Vista
      <select id="vis">
        <option value="todos">Todos los días</option>
        <option value="dia">Por día</option>
      </select>
    </label>
    <label style="display:block;margin-bottom:10px">Ejercicio
      <select id="ex"></select>
    </label>
    <label style="display:block;margin-bottom:10px">Medida
      <select id="met">
        <option value="max">Carga máxima (kg)</option>
        <option value="vol">Volumen (kg × reps)</option>
      </select>
    </label>
    <p class="mu" id="pmsg"></p>
  </div>
  <div class="card"><canvas id="grafica"></canvas></div>
  <div class="card"><table id="tbl" style="width:100%;border-collapse:collapse;font-size:15px"></table></div>
</section>

<section id="perfil" hidden style="padding:8px 14px;max-width:640px;margin:0 auto">
  <div class="card center">
    <div id="pf-foto" class="avatar"></div>
    <button id="pf-btnfoto" class="chip">Cambiar foto</button>
    <input type="file" id="pf-fotoin" accept="image/*" style="display:none">
    <label class="campo">Nombre
      <input id="pf-nombre" maxlength="40" placeholder="Tu nombre">
    </label>
    <label class="campo">Descripción
      <textarea id="pf-desc" maxlength="150" rows="2" placeholder="Algo sobre ti"></textarea>
    </label>
  </div>
  <div class="card">
    <h2 class="sub">Ejercicio favorito</h2>
    <p id="pf-fav" class="mu"></p>
  </div>
  <div class="card">
    <h2 class="sub">Mis 4 canciones para entrenar</h2>
    <div id="pf-cancs"></div>
    <input type="file" id="pf-portadain" accept="image/*" style="display:none">
  </div>
</section>
<section id="inicio" hidden>
  <div class="ini-box">
    <h2>¿Qué días entrenas?</h2>
    <p class="mu">Marca tus días de entreno. Los demás serán de descanso.</p>
    <div id="ini-dias"></div>
    <button id="ini-ok">Comenzar</button>
    <button id="ini-cancel">Cancelar</button>
  </div>
</section>
<div id="ov" hidden></div>
<aside id="drawer">
  <div id="dv-main">
    <div class="dh"><span>Menú</span><button id="dclose" class="dx" aria-label="Cerrar">✕</button></div>
    <button id="vp" class="drow">Ver progreso</button>
    <button id="nw" class="drow">Iniciar nueva semana</button>
    <button class="drow" data-sub="datos">Datos <span>›</span></button>
    <button class="drow" data-sub="rutina">Rutina <span>›</span></button>
  </div>
  <div id="dv-datos" hidden>
    <div class="dh"><button class="back" data-back aria-label="Volver">‹</button><span>Datos</span></div>
    <button id="xc" class="drow">Exportar CSV</button>
    <button id="xj" class="drow">Exportar JSON</button>
    <button id="im" class="drow">Importar JSON</button>
  </div>
  <div id="dv-rutina" hidden>
    <div class="dh"><button class="back" data-back aria-label="Volver">‹</button><span>Rutina</span></div>
    <button id="ed" class="drow">Editar rutina</button>
    <button id="un" class="drow"></button>
    <button id="cambiardias" class="drow">Días de entreno</button>
    <button id="cl" class="drow">Limpiar datos</button>
  </div>
</aside>

<div id="md" hidden><div class="bx"><p id="mt"></p><textarea id="mx" readonly></textarea><div class="ac" id="mb"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="inicio.js"></script>
<script src="app.js"></script>
<script src="correcciones.js"></script>
<script src="progreso.js"></script>
<script src="importar.js"></script>
<script src="menu.js"></script>
<script src="perfil.js"></script>
<script>iniciarInicio();</script>
</body>
</html>
