<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Progreso · Pilotozyz</title>
<style>
:root{--bg:#0A0A0A;--c1:#161616;--c2:#222222;--bd:#333333;--tx:#FFFFFF;--mu:#A0A0A0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,-apple-system,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.mu{color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
select,input[type=file]{width:100%;margin-top:6px;min-height:48px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:0 10px;font:inherit}
canvas{width:100%;max-height:360px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mu);font-weight:600}
td.n,th.n{text-align:right}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Progreso por ejercicio</h1>

  <section class="card">
    <label>Archivo de datos (rutina_limpia.csv)
      <input type="file" id="f" accept=".csv,text/csv">
    </label>
    <p class="mu">Carga aquí la tabla que generamos. Los datos se quedan solo en tu navegador.</p>
  </section>

  <section class="card" id="ctl" hidden>
    <label>Vista
      <select id="vis">
        <option value="todos">Todos los días</option>
        <option value="dia">Por día</option>
      </select>
    </label>
    <label>Ejercicio
      <select id="ex"></select>
    </label>
    <label>Medida
      <select id="met">
        <option value="max">Carga máxima (kg)</option>
        <option value="vol">Volumen (kg × reps)</option>
      </select>
    </label>
  </section>

  <section class="card" id="box" hidden>
    <canvas id="c"></canvas>
  </section>

  <section class="card" id="tb" hidden>
    <table>
      <thead><tr><th>Semana</th><th class="n" id="colv">Carga máxima (kg)</th><th class="n">Series</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="mu">Las semanas sin datos aparecen vacías. Cada ejercicio se separa por día porque la misma máquina puede tener cargas distintas según el día.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
let data = [], chart = null;
const $ = id => document.getElementById(id);
const num = v => (v === '' || v == null) ? null : parseFloat(v);

function parseCSV(txt) {
  const lines = txt.replace(/^\uFEFF/, '').trim().split(/\r?\n/);
  const h = lines[0].split(',');
  return lines.slice(1).map(l => {
    const p = l.split(',');
    const o = {};
    h.forEach((k, i) => o[k] = (p[i] ?? '').trim());
    return o;
  }).filter(o => o.semana);
}

function groups() {
  const g = {};
  data.forEach(r => {
    const k = r.ejercicio + ' · ' + r.dia;
    (g[k] = g[k] || []).push(r);
  });
  return g;
}

function serie(rows, met) {
  const semanas = [...new Set(rows.map(r => +r.semana))].sort((a, b) => a - b);
  const max = Math.max(...data.map(r => +r.semana));
  const out = [];
  for (let s = 1; s <= max; s++) {
    const rs = rows.filter(r => +r.semana === s);
    let val = null;
    if (met === 'max') {
      const kgs = rs.map(r => num(r.kg)).filter(v => v != null);
      if (kgs.length) val = Math.max(...kgs);
    } else {
      const vs = rs.map(r => (num(r.kg) != null && num(r.reps) != null) ? num(r.kg) * num(r.reps) : null).filter(v => v != null);
      if (vs.length) val = Math.round(vs.reduce((a, b) => a + b, 0));
    }
    out.push({ semana: s, val, series: rs.length });
  }
  return out;
}

function render() {
  const key = $('ex').value;
  const met = $('met').value;
  const rows = $('vis').value === 'todos'
    ? data.filter(r => r.ejercicio === key)
    : (groups()[key] || []);
  const pts = serie(rows, met);
  const etiqueta = met === 'max' ? 'Carga máxima (kg)' : 'Volumen (kg × reps)';
  $('colv').textContent = etiqueta;

  $('tbody').innerHTML = pts.map(p =>
    `<tr><td>Semana ${p.semana}</td><td class="n">${p.val ?? '—'}</td><td class="n">${p.series}</td></tr>`
  ).join('');

  if (chart) chart.destroy();
  chart = new Chart($('c'), {
    type: 'line',
    data: {
      labels: pts.map(p => 'Sem ' + p.semana),
      datasets: [{
        label: etiqueta,
        data: pts.map(p => p.val),
        borderColor: '#E5E5E5',
        backgroundColor: '#FFFFFF',
        pointRadius: 5,
        spanGaps: false,
        tension: 0.2
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#E5E5E5' } } },
      scales: {
        x: { ticks: { color: '#A0A0A0' }, grid: { color: '#222' } },
        y: { ticks: { color: '#A0A0A0' }, grid: { color: '#222' }, beginAtZero: false }
      }
    }
  });
}

function llenarEjercicios() {
  const esc = s => s.replace(/"/g, '&quot;');
  if ($('vis').value === 'todos') {
    const ejercicios = [...new Set(data.map(r => r.ejercicio))].sort();
    $('ex').innerHTML = ejercicios.map(e => `<option value="${esc(e)}">${e}</option>`).join('');
  } else {
    $('ex').innerHTML = Object.keys(groups()).sort().map(k => `<option value="${esc(k)}">${k}</option>`).join('');
  }
}

$('f').addEventListener('change', async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  data = parseCSV(await file.text());
  llenarEjercicios();
  ['ctl', 'box', 'tb'].forEach(id => $(id).hidden = false);
  render();
});
$('vis').addEventListener('change', () => { llenarEjercicios(); render(); });
$('ex').addEventListener('change', render);
$('met').addEventListener('change', render);
</script>
</body>
</html>
